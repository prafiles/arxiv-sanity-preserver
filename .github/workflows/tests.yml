name: tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  build:
    name: Native build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No Dockerfile or packaging in this repo: the build test is a
      # byte-compile of every shipped script (catches syntax errors in the
      # daemons the unit tests don't import).
      - name: Byte-compile all scripts
        run: python -m compileall -q -x 'tests/|notebooks/' .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements-test.txt
      - name: Run pytest
        run: python -m pytest
